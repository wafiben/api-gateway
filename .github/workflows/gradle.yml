name: Java CI

# Déclenche le pipeline sur push vers main et feature/**, et sur PR vers main
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source du repo
      - uses: actions/checkout@v3

      # Installe Java 17 (Temurin = distribution Eclipse)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Lance les tests unitaires en excluant les tests end-to-end
      - name: Run unit tests
        run: mvn test -Dexcludes="**/endtoend/**"

      # Compile et package le projet sans relancer les tests
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # Authentification sur Docker Hub avec les secrets GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build l'image Docker avec deux tags :
      # - le SHA du commit (version précise)
      # - latest (version courante)
      - name: Build Docker image
        run: docker build --target runtime -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest .

      # Push les deux tags vers Docker Hub
      # Le déploiement sur Railway se fait manuellement :
      # Railway → Service → Settings → Source → wafi111/api-gateway:latest → Redeploy
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest